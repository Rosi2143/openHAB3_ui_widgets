version: 1
widgets:
  main_widget_Security_Keypad:
    tags: []
    props:
      parameters:
        - context: item
          description: Item holding the security mode
          label: Security Mode Item
          name: securityMode
          required: true
          type: TEXT
        - context: item
          description: Item holding the reference PIN
          label: Pin Item
          name: referencePIN
          required: true
          type: TEXT
        - description: Replace pincode characters with this string, leave blank to show it as-is
          label: Mask character
          name: mask
          required: false
          type: TEXT
        - context: text
          description: Target Security Mode
          name: targetMode
          required: true
          type: TEXT
      parameterGroups: []
    component: f7-block
    config:
      class:
        - padding
      style:
        --f7-button-bg-color: var(--f7-card-bg-color)
        --f7-button-text-color: var(--f7-text-color)
        --f7-theme-color-rgb: var(--f7-color-blue-rgb)
        background: =(themeOptions.dark=="light") ? ("white"):("black")
    slots:
      default:
        - component: oh-label-card
          config:
            class:
              - margin-bottom
            label: "=(props.mask && vars.pincode) ? props.mask.repeat(vars.pincode.length || 0) : vars.pincode"
            outline: true
        - component: f7-row
          config:
            class:
              - margin
          slots:
            default:
              - component: oh-repeater
                config:
                  for: key_number
                  fragment: true
                  in:
                    - "1"
                    - "2"
                    - "3"
                  sourceType: array
                slots:
                  default:
                    - component: f7-col
                      slots:
                        default:
                          - component: oh-button
                            config:
                              action: variable
                              actionVariable: pincode
                              actionVariableValue: "=(vars.pincode) ? vars.pincode + loop.key_number : loop.key_number"
                              large: true
                              raised: true
                              text: =loop.key_number
        - component: f7-row
          config:
            class:
              - margin
          slots:
            default:
              - component: oh-repeater
                config:
                  for: key_number
                  fragment: true
                  in:
                    - "4"
                    - "5"
                    - "6"
                  sourceType: array
                slots:
                  default:
                    - component: f7-col
                      slots:
                        default:
                          - component: oh-button
                            config:
                              action: variable
                              actionVariable: pincode
                              actionVariableValue: "=(vars.pincode) ? vars.pincode + loop.key_number : loop.key_number"
                              large: true
                              raised: true
                              text: =loop.key_number
        - component: f7-row
          config:
            class:
              - margin
          slots:
            default:
              - component: oh-repeater
                config:
                  for: key_number
                  fragment: true
                  in:
                    - "7"
                    - "8"
                    - "9"
                  sourceType: array
                slots:
                  default:
                    - component: f7-col
                      slots:
                        default:
                          - component: oh-button
                            config:
                              action: variable
                              actionVariable: pincode
                              actionVariableValue: "=(vars.pincode) ? vars.pincode + loop.key_number : loop.key_number"
                              large: true
                              raised: true
                              text: =loop.key_number
        - component: f7-row
          config:
            class:
              - margin
          slots:
            default:
              - component: oh-repeater
                config:
                  for: key_number
                  fragment: true
                  in:
                    - "*"
                    - "0"
                    - "#"
                  sourceType: array
                slots:
                  default:
                    - component: f7-col
                      slots:
                        default:
                          - component: oh-button
                            config:
                              action: variable
                              actionVariable: pincode
                              actionVariableValue: "=(vars.pincode) ? vars.pincode + loop.key_number : loop.key_number"
                              large: true
                              raised: true
                              text: =loop.key_number
        - component: f7-row
          config:
            class:
              - margin
            style:
              --f7-button-bg-color: transparent
              --f7-theme-color: var(--f7-color-blue)
          slots:
            default:
              - component: f7-col
                slots:
                  default:
                    - component: oh-button
                      config:
                        action: variable
                        actionVariable: pincode
                        actionVariableValue: ""
                        large: true
                        text: Clear
              - component: f7-col
                slots:
                  default:
                    - component: oh-button
                      config:
                        action: command
                        actionCommand: '=(items[props.referencePIN].state != vars.pincode) ? "" : props.targetMode'
                        actionFeedback: ='{ "text":"Alarmmodus geändert","position":"center","closeButton":"true" }'
                        actionItem: =props.securityMode
                        clearVariable: pincode
                        disabled: =!vars.pincode
                        fill: true
                        large: true
                        popup-close: true
                        text: Enter
              - component: f7-col
                slots:
                  default:
                    - component: oh-button
                      config:
                        action: variable
                        actionVariable: pincode
                        actionVariableValue: '=(vars.pincode) ? vars.pincode.substring(0, vars.pincode.length - 1) : ""'
                        large: true
                        text: Back
